name: build and test

on:
  push:
  pull_request:
    branches:
        - master
    paths:
        - '**.cs'
        - '**.csproj'

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    name: build-${{matrix.os}}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test on unit test
      run: dotnet test --no-build --configuration Release test/hihapi.test/hihapi.unittest.csproj /p:CollectCoverage=true /p:CoverletOutput=../../coverage/ -- "RunConfiguration.TreatNoTestsAsError=false"

    - name: Test on integration test
      run: dotnet test --no-build --configuration Release test/hihapi.integrationtest/hihapi.integrationtest.csproj /p:CollectCoverage=true /p:CoverletOutput=../../coverage/ /p:MergeWith="../../coverage/coverage.json" /p:CoverletOutputFormat="cobertura" -- "RunConfiguration.TreatNoTestsAsError=false"

    - name: Copy Coverage To Predictable Location
      run: cp coverage/coverage.cobertura.xml coverage.cobertura.xml

    - name: Code Coverage Summary Report
      uses: irongut/CodeCoverageSummary@v1.2.0
      with:
        filename: coverage.cobertura.xml
        badge: true
        fail_below_min: true
        format: markdown
        hide_branch_rate: false
        hide_complexity: true
        indicators: true
        output: both
        thresholds: '50 80'

    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: code-coverage-results.md
